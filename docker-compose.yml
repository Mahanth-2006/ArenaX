version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: arenax_db
      MYSQL_USER: arenax
      MYSQL_PASSWORD: arenax_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: arenax
      DB_PASSWORD: arenax_pass
      DB_NAME: arenax_db
      SECRET_KEY: arenax_production_secret_key_change_me
    depends_on:
      - db

volumes:
  db_data: